name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.13]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies with uv
        run: |
          uv sync
          # Install pre-commit into uv's environment and run hooks
          uv pip install --upgrade pre-commit
          uv run pre-commit run --all-files

      - name: Lint (ruff) via uv
        run: |
          uv pip install --upgrade ruff
          uv run ruff check .

      - name: Type-check (ty) via uv
        run: |
          uv pip install --upgrade ty
          uv run ty check . || true

      - name: Security scan (bandit) via uv
        run: |
          uv pip install --upgrade bandit
          uv run bandit -r src || true

      - name: Dependency audit (pip-audit) via uv
        run: |
          uv pip install --upgrade pip-audit
          uv run pip-audit --progress spinner || true

      - name: Spelling check (codespell) via uv
        run: |
          uv pip install --upgrade codespell
          uv run codespell . || true

      - name: Run tests
        run: uv run -m pytest -q
